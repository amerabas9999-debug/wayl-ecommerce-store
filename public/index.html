<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayl Ecommerce Store</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🛍️ Wayl Store</h1>
                <div class="nav">
                    <button class="nav-btn active" onclick="showSection('shop')">Shop</button>
                    <button class="nav-btn" onclick="showSection('cart')">Cart <span id="cartCount" class="badge">0</span></button>
                    <button class="nav-btn" onclick="showSection('orders')">My Orders</button>
                </div>
            </div>
        </header>

        <!-- Shop Section -->
        <section id="shop" class="section active">
            <h2>Products</h2>
            <div id="productsGrid" class="products-grid"></div>
        </section>

        <!-- Cart Section -->
        <section id="cart" class="section">
            <h2>Shopping Cart</h2>
            <div id="cartItems" class="cart-items"></div>
            <div class="cart-summary">
                <p>Total: <strong id="cartTotal">0 IQD</strong></p>
                <button id="checkoutBtn" class="btn-primary" onclick="checkout()">Proceed to Checkout</button>
            </div>
        </section>

        <!-- Orders Section -->
        <section id="orders" class="section">
            <h2>My Orders</h2>
            <div id="ordersList" class="orders-list"></div>
        </section>

        <!-- Order Details Modal -->
        <div id="orderModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <h3>Order Details</h3>
                <div id="orderDetails"></div>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
