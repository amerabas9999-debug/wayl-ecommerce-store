<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>MBOOSTT · LUXE DIGITAL EMPORIUM</title>
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;500;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1c0808;
      background-image: 
        radial-gradient(circle at 15% 20%, #4a1a1a 0%, #1a0505 85%),
        radial-gradient(circle at 85% 80%, #3b1212 0%, #170404 90%);
      background-blend-mode: overlay;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: #f5e9dc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 3rem;
      position: relative;
      overflow-x: hidden;
      letter-spacing: 0.3px;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 40%, rgba(150, 40, 20, 0.35), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 1500px;
      position: relative;
      z-index: 2;
    }

    /* MODERN LUXURY HEADER */
    .luxury-header {
      text-align: center;
      margin-bottom: 3rem;
      position: relative;
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3.5rem, 12vw, 7rem);
      font-weight: 900;
      letter-spacing: 8px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fbe6c2, #e6b17e, #d4a373, #c98d5e, #e6b17e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 25px rgba(255,180,120,0.7);
      filter: drop-shadow(0 8px 12px #00000060);
      transform: perspective(800px) rotateX(3deg);
      transition: transform 0.3s ease;
      line-height: 1.1;
      position: relative;
      display: inline-block;
    }

    .brand-name::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c98d5e, transparent);
    }

    .brand-name:hover {
      transform: perspective(900px) rotateX(0deg) scale(1.02);
    }

    .tagline {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #e3b891;
      margin-top: 1.2rem;
      word-spacing: 8px;
      display: inline-block;
      padding: 0.7rem 2rem;
      background: rgba(12, 4, 4, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 60px;
      border: 1px solid #ad6b4a;
    }

    /* PRODUCT GRID */
    .product-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2.5rem;
      margin: 2.5rem 0 2rem;
      perspective: 1500px;
    }

    .product-card {
      background: rgba(28, 10, 10, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid #7a3e2e;
      border-radius: 32px;
      padding: 1.8rem 1.2rem 1.5rem;
      width: 320px;
      max-width: 90vw;
      transition: all 0.45s cubic-bezier(0.2, 0.9, 0.4, 1);
      box-shadow: 0 30px 45px -15px rgba(0,0,0,0.9), 0 0 0 1px #b0643e inset;
      transform-style: preserve-3d;
      transform: rotateY(0deg) rotateX(0deg);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .product-card:hover {
      transform: rotateY(3deg) rotateX(2deg) translateY(-15px) scale(1.01);
      box-shadow: 0 50px 70px -15px #120404, 0 0 35px #bb6b4b;
      border-color: #d18d5f;
    }

    .product-card::after {
      content: '';
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      bottom: 14px;
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255,190,140,0.1), transparent 55%);
      pointer-events: none;
      z-index: 1;
    }

    /* PRODUCT MEDIA */
    .product-media {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 22px;
      background: #1a0808;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.3rem;
      overflow: hidden;
      border: 2px solid #9b5e3c;
      box-shadow: 0 15px 30px rgba(0,0,0,0.8);
      position: relative;
      z-index: 2;
    }

    .product-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-title {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.8rem;
      letter-spacing: 1px;
      color: #fae3c8;
      margin: 0.6rem 0 0.3rem;
      z-index: 2;
      text-shadow: 0 3px 10px black;
      text-align: center;
      word-break: break-word;
    }

    .product-description {
      font-size: 0.85rem;
      color: #bda38b;
      text-align: center;
      margin-bottom: 0.5rem;
      line-height: 1.3;
      z-index: 2;
    }

    .product-price {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 2.2rem;
      color: #e9b384;
      background: rgba(0,0,0,0.4);
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      letter-spacing: 2px;
      margin: 0.8rem 0;
      border: 1px solid #a86644;
      z-index: 2;
    }

    .btn-buy {
      background: linear-gradient(145deg, #a54f2e, #6e2f1c);
      border: none;
      color: #ffeedd;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 0.9rem 2rem;
      border-radius: 50px;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 12px 18px -5px #00000080, 0 0 0 1px #c47b4a inset;
      transition: all 0.3s;
      z-index: 5;
      margin-bottom: 1rem;
      width: 100%;
    }

    .btn-buy:hover {
      background: linear-gradient(145deg, #c26037, #8a3b22);
      box-shadow: 0 20px 28px -8px #000, 0 0 25px #e07e4a;
      transform: translateY(-4px);
      letter-spacing: 3px;
    }

    .btn-buy:disabled {
      opacity: 0.7;
      cursor: default;
      letter-spacing: 2px;
      transform: none;
    }

    .hidden-link-area {
      font-size: 0.8rem;
      color: #c9a37b;
      text-align: center;
      opacity: 0.9;
      letter-spacing: 1px;
      word-break: break-all;
      background: rgba(0,0,0,0.3);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      max-width: 100%;
      display: none;
      z-index: 5;
    }

    /* Loading spinner */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #e6c39a;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .success-message {
      color: #90EE90;
      font-weight: bold;
      margin-top: 10px;
    }

    .error-message {
      color: #FF6B6B;
      font-weight: bold;
      margin-top: 10px;
    }

    @media (max-width: 700px) {
      .product-card {
        width: 85%;
        max-width: 350px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="luxury-header">
      <h1 class="brand-name">MBOOSTT</h1>
      <div class="tagline">LUXE DIGITAL · LIMITLESS</div>
    </div>

    <!-- PRODUCT GRID -->
    <div class="product-grid" id="productGrid"></div>
  </div>

  <script>
    // Initialize products and handle checkout
    async function initializeStore() {
      try {
        const response = await fetch('/api/products');
        const result = await response.json();
        
        if (result.success && result.data) {
          const grid = document.getElementById('productGrid');
          grid.innerHTML = '';
          
          result.data.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
              <div class="product-media">
                <img src="${product.image || 'https://via.placeholder.com/240'}" alt="${product.title}">
              </div>
              <div class="product-title">${product.title}</div>
              ${product.description ? `<div class="product-description">${product.description}</div>` : ''}
              <div class="product-price">${product.price}</div>
              <button class="btn-buy" onclick="buyProduct('${product.id}')">ACQUIRE</button>
              <div class="hidden-link-area" style="display:none;">🔓 ${product.link}</div>
            `;
            grid.appendChild(card);
          });
        }
      } catch (error) {
        console.error('Error loading products:', error);
      }
    }

    async function buyProduct(productId) {
      const btn = event.target;
      const originalText = btn.textContent;
      btn.innerHTML = '<span class="loading"></span>Processing...';
      btn.disabled = true;

      try {
        // Get product info
        const prodResponse = await fetch(`/api/products/${productId}`);
        const prodResult = await prodResponse.json();
        
        if (!prodResult.success) {
          throw new Error('Product not found');
        }

        const product = prodResult.data;

        // Collect customer info
        const customerName = prompt('Enter your name:');
        if (!customerName) {
          btn.textContent = originalText;
          btn.disabled = false;
          return;
        }

        const customerEmail = prompt('Enter your email:');
        if (!customerEmail) {
          btn.textContent = originalText;
          btn.disabled = false;
          return;
        }

        const customerPhone = prompt('Enter your phone number:');
        if (!customerPhone) {
          btn.textContent = originalText;
          btn.disabled = false;
          return;
        }

        // Create checkout
        const checkoutResponse = await fetch('/api/checkout', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            productId,
            customer: {
              name: customerName,
              email: customerEmail,
              phone: customerPhone
            }
          })
        });

        const checkoutResult = await checkoutResponse.json();

        if (checkoutResult.success) {
          console.log('Checkout successful:', checkoutResult.data);
          // Redirect to Wayl checkout
          window.location.href = checkoutResult.data.checkoutUrl;
        } else {
          throw new Error(checkoutResult.message);
        }
      } catch (error) {
        console.error('Checkout error:', error);
        alert('❌ Error: ' + error.message);
        btn.textContent = originalText;
        btn.disabled = false;
      }
    }

    // Check for success redirect
    function checkForSuccess() {
      const params = new URLSearchParams(window.location.search);
      const ref = params.get('ref');
      
      if (ref) {
        setTimeout(() => {
          fetch(`/api/orders/${ref}`)
            .then(r => r.json())
            .then(result => {
              if (result.success) {
                const order = result.data;
                if (order.status === 'Complete' || order.status === 'Delivered') {
                  const link = order.product.link;
                  alert(`✅ Payment successful!\n\n🔓 Your Link:\n${link}`);
                } else {
                  alert(`📦 Order Status: ${order.status}`);
                }
              }
            })
            .catch(err => console.error('Error checking order:', err));
        }, 2000);
      }
    }

    // Apply 3D tilt effect
    function applyTilt(card) {
      card.addEventListener('mousemove', function(e) {
        const rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        card.style.transform = `rotateY(${x*8}deg) rotateX(${y*-6}deg) translateY(-10px) scale(1.02)`;
      });
      card.addEventListener('mouseleave', function() {
        card.style.transform = 'rotateY(0deg) rotateX(0deg) translateY(0) scale(1)';
      });
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', () => {
      initializeStore();
      checkForSuccess();
      
      // Apply tilt to cards as they're added
      const observer = new MutationObserver(() => {
        document.querySelectorAll('.product-card').forEach(card => {
          if (!card.dataset.tiltBound) {
            card.dataset.tiltBound = 'true';
            applyTilt(card);
          }
        });
      });
      
      observer.observe(document.getElementById('productGrid'), { childList: true });
    });
  </script>
</body>
</html>
